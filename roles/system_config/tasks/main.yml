- name: Install Basics
  ansible.builtin.apt:
    update_cache: yes
    name:
      - sudo
      - zsh
      - iptables-persistent
      - vim-gtk3
      - net-tools
      - netcat-openbsd
      - spice-vdagent
      - qemu-guest-agent
      - sshpass
      - tmux
      - gcc
      - binutils-doc
      - make
      - autoconf
      - automake
      - flex
      - bison
      - gdb
      - git
      - sshfs
      - unattended-upgrades
      - tcpdump
      - postfix
      - postfix-cdb
      - bsd-mailx
      - dnsutils
      - python-is-python3
      - wireguard
      - wireguard-tools
      - nmap

- name: Add user to sudo, set shell to zsh, generate SSH key
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
    groups: sudo
    append: yes
    generate_ssh_key: yes

- name: Set root shell to zsh, generate SSH key
  ansible.builtin.user:
    name: root
    shell: /usr/bin/zsh
    generate_ssh_key: yes

- name: Setup Unattended Upgrades - Debconf Selections
  ansible.builtin.shell: echo unattended-upgrades unattended-upgrades/enable_auto_updates boolean true | debconf-set-selections
  args:
    creates: /etc/apt/apt.conf.d/20auto-upgrades

- name: Setup Unattended Upgrades - Run dpkg-reconfigure
  ansible.builtin.shell: /usr/sbin/dpkg-reconfigure -f noninteractive unattended-upgrades
  args:
    creates: /etc/apt/apt.conf.d/20auto-upgrades

- name: Setup Unattended Upgrades - Email Root
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::Mail '
    line: 'Unattended-Upgrade::Mail "root";'

- name: Setup Unattended Upgrades - Email On Error
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: 'Unattended-Upgrade::MailReport '
    line: 'Unattended-Upgrade::MailReport "only-on-error";'

- name: Setup Mail Agent - Aliases
  ansible.builtin.template:
    src: aliases
    dest: /etc/aliases
    owner: root
    group: root
    mode: '0644'
  register: postfixaliases

- name: Setup Postfix Mail Agent - main.cf
  ansible.builtin.template:
    src: main.cf
    dest: /etc/postfix/main.cf
    owner: root
    group: postfix
    mode: '0644'
  register: postfixmain

- name: Setup Postfix Mail Agent - master.cf
  ansible.builtin.template:
    src: master.cf
    dest: /etc/postfix/master.cf
    owner: root
    group: postfix
    mode: '0644'
  register: postfixmaster

- name: Setup Postfix Mail Agent - sasl_passwd
  ansible.builtin.template:
    src: sasl_passwd
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: postfix
    mode: '0640'
  register: postfixpasswd

- name: Update Postfix Aliases If Needed
  ansible.builtin.command:
    cmd: /usr/bin/newaliases
  when: postfixaliases.changed

- name: Restart Postfix Mail Agent
  ansible.builtin.systemd_service:
    name: postfix
    state: restarted
  when: postfixaliases.changed or postfixmain.changed or postfixmaster.changed or postfixpasswd.changed
